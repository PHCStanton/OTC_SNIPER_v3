<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter for 3D depth -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#1f1402" flood-opacity="0.65"/>
    </filter>

    <!-- Glossy Emboss Effect -->
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1.5" dy="1.5" in="SourceAlpha" result="offset"/>
      <feGaussianBlur stdDeviation="1.5" in="offset" result="blur"/>
      <feSpecularLighting surfaceScale="3.5" specularConstant="1.5" specularExponent="25" lighting-color="#fff9e6" in="blur" result="light">
        <feDistantLight azimuth="220" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="light" in2="SourceAlpha" operator="in" result="specular"/>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1.3" k4="0"/>
    </filter>

    <!-- Linear Gold Chrome Gradient (Diagonal) -->
    <linearGradient id="gold-chrome-diag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e3403" />
      <stop offset="15%" stop-color="#d4af37" />
      <stop offset="22%" stop-color="#fffbe6" />
      <stop offset="42%" stop-color="#aa7c11" />
      <stop offset="48%" stop-color="#5c3d03" />
      <stop offset="68%" stop-color="#f3e5ab" />
      <stop offset="74%" stop-color="#ffffff" />
      <stop offset="88%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#5c3d03" />
    </linearGradient>

    <!-- Linear Gold Chrome Gradient (Vertical) -->
    <linearGradient id="gold-chrome-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3d03" />
      <stop offset="12%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="48%" stop-color="#fffbe6" />
      <stop offset="52%" stop-color="#4e3403" />
      <stop offset="72%" stop-color="#f3e5ab" />
      <stop offset="78%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#4e3403" />
    </linearGradient>

    <!-- Gold Bevel Edge Gradient -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffe082" />
      <stop offset="65%" stop-color="#795548" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Ambient Gold/Orange Glow -->
    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#ff8f00" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a1922" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#gold-glow)" />

  <!-- Main Visual Group with Shadow -->
  <g filter="url(#shadow)">

    <!-- ========================================== -->
    <!-- OUTER GOLDEN RING (DOUBLE-BEZEL)           -->
    <!-- ========================================== -->
    <!-- Main Ring Face -->
    <circle cx="250" cy="250" r="200" fill="none" stroke="url(#gold-chrome-diag)" stroke-width="18" />
    <!-- Outer Bevel Edge Highlight -->
    <circle cx="250" cy="250" r="209" fill="none" stroke="url(#gold-bevel)" stroke-width="1.5" />
    <!-- Inner Bevel Edge Highlight -->
    <circle cx="250" cy="250" r="191" fill="none" stroke="url(#gold-bevel)" stroke-width="1.5" />
    <!-- Inner Groove Shadow Ring -->
    <circle cx="250" cy="250" r="189.5" fill="none" stroke="#2d1d02" stroke-width="1" />

    <!-- ========================================== -->
    <!-- CENTRAL BAR CHART                          -->
    <!-- ========================================== -->
    <g filter="url(#emboss)">
      <!-- Bar 1 (Left) -->
      <rect x="180" y="210" width="22" height="75" rx="3" fill="url(#gold-chrome-vert)" stroke="url(#gold-bevel)" stroke-width="1.5" />
      <!-- Bar 2 (Middle) -->
      <rect x="212" y="175" width="22" height="110" rx="3" fill="url(#gold-chrome-vert)" stroke="url(#gold-bevel)" stroke-width="1.5" />
      <!-- Bar 3 (Right) -->
      <rect x="244" y="135" width="22" height="150" rx="3" fill="url(#gold-chrome-vert)" stroke="url(#gold-bevel)" stroke-width="1.5" />
    </g>

    <!-- ========================================== -->
    <!-- CURVED GROWTH ARROWS & BASE CRESCENT       -->
    <!-- ========================================== -->
    <!-- Base Crescent Cradle -->
    <path d="M 165,325 C 200,380 270,380 325,330 C 345,305 352,270 350,230 C 348,205 342,190 330,175 C 335,185 338,205 338,225 C 340,260 332,290 315,312 C 270,355 205,355 172,315 Z" 
          fill="url(#gold-chrome-diag)" stroke="url(#gold-bevel)" stroke-width="1.5" stroke-linejoin="round" filter="url(#emboss)" />

    <!-- Arrow 1 (Main/Top Curved Arrow) -->
    <path d="M 148,262 C 148,295 180,318 230,305 C 275,292 315,225 320,150 L 328,162 L 322,135 L 298,152 L 308,160 C 302,225 268,280 226,290 C 185,300 156,280 156,262 Z" 
          fill="url(#gold-chrome-diag)" stroke="url(#gold-bevel)" stroke-width="1.5" stroke-linejoin="round" filter="url(#emboss)" />

    <!-- Arrow 2 (Secondary/Lower Curved Arrow) -->
    <path d="M 165,315 C 190,332 230,335 270,312 C 295,296 308,272 312,242 L 318,252 L 314,228 L 295,242 L 304,248 C 300,272 288,290 264,302 C 230,320 196,318 172,308 Z" 
          fill="url(#gold-chrome-diag)" stroke="url(#gold-bevel)" stroke-width="1.5" stroke-linejoin="round" filter="url(#emboss)" />

  </g>
</svg>
