version: '3.8'

services:
  openwa-gateway:
    image: openwa/wa-automate:latest
    container_name: openwa_whatsapp_gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_KEY=${OPENWA_API_KEY:-secret_wa_key}
    restart: unless-stopped
    # Intentionally no service_healthy condition: third-party image health
    # contract is not verified. OpenWA is an optional recoverable adapter.

  vps-data-agent:
    build:
      context: ..
      dockerfile: data-agent/Dockerfile.vps
    container_name: otc_vps_data_agent
    ports:
      - "8090:8090"
    environment:
      - PO_SSID=${PO_SSID}
      - XAI_API_KEY=${XAI_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-otc-sniper-prod}
      - OPENWA_API_URL=http://openwa-gateway:8080
      - OPENWA_RECIPIENT_PHONE=${OPENWA_RECIPIENT_PHONE}
      - TELEMETRY_PORT=8090
    depends_on:
      - openwa-gateway
    restart: unless-stopped
    # Health uses data-agent liveness only; does not require OpenWA readiness.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./data:/app/data-agent/data
      - ../app/data/ghost_trades/stats:/app/app/data/ghost_trades/stats
